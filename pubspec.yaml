name: psgy
description: PSgy — tìm gym + đặt lịch Coach tại TP.HCM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10
  firebase_performance: ^0.10.1+8
  google_maps_flutter: ^2.9.0
  google_maps_flutter_platform_interface: ^2.15.0
  geolocator: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Utils
  uuid: ^4.5.0
  equatable: ^2.0.7
  intl: ^0.19.0
  fluttertoast: ^8.2.8
  path_provider: ^2.1.5

  # Local cache
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Navigation & UI
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^18.0.1
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  figma_squircle: ^0.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icons/app_icon_user.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icons/app_icon_user.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter_native_splash:
  color: "#2563EB"
  android_12:
    color: "#2563EB"
    image: assets/images/branding/splash_blank.png
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/branding/
    - assets/images/icons/
    - assets/images/journal/
    - assets/animations/
    - assets/map_style/
